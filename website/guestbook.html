<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITFUC — Notes</title>
  <link rel="stylesheet" href="css/bitfuc.css">
  <link rel="icon" href="img/fuc-coin.png">
</head>
<body>
<script src="js/banner.js"></script>
<main class="page">
  <p class="doc-kicker">Document 09 · Correspondence</p>
  <h2>No comment facility</h2>
  <p>This form is not a registrar, a transfer agent, or a mailing list. Submissions are discarded in the browser. There is no database.</p>
  <form action="#" method="get" onsubmit="alert('Discarded. Nothing was transmitted.'); return false;">
    <p>Name<br><input name="n" maxlength="40" autocomplete="off"></p>
    <p>Note<br><textarea name="m" rows="4" maxlength="200"></textarea></p>
    <p><button type="submit">Discard locally</button></p>
  </form>
  <div class="box">File of received comments: empty, by construction.</div>
</main>
<script src="js/footer.js"></script>
</body>
</html>
