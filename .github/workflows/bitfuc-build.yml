name: bitfuc-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev libevent-dev libsqlite3-dev pkg-config python3
      - name: Configure and build
        run: |
          cmake -B build -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DINSTALL_MAN=OFF
          cmake --build build --target bitcoind bitcoin-cli -j"$(nproc)"
      - name: SHA-256
        run: |
          echo "commit $(git rev-parse HEAD)"
          sha256sum build/bin/bitfucd build/bin/bitfuc-cli
      - uses: actions/upload-artifact@v4
        with:
          name: bitfuc-linux-x86_64
          path: |
            build/bin/bitfucd
            build/bin/bitfuc-cli
